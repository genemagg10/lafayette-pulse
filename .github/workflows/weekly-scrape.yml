name: Lafayette Pulse — Collect & Classify

on:
  schedule:
    - cron: '0 10 * * *'   # Daily at 2am PST (10am UTC)
  workflow_dispatch:         # Manual trigger via GitHub Actions UI
    inputs:
      embeddings_only:
        description: 'Only run embedding generation (skip scraping/classification)'
        required: false
        type: boolean
        default: false

jobs:
  collect-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Poll Granicus RSS feeds
        if: ${{ !inputs.embeddings_only }}
        working-directory: scripts
        run: python scrape-granicus.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Collect emails from city notifications
        if: ${{ !inputs.embeddings_only }}
        working-directory: scripts
        run: python scrape-agendas.py
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Classify with Claude & generate embeddings
        if: ${{ !inputs.embeddings_only }}
        working-directory: scripts
        run: python classify-with-claude.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate embeddings for existing data
        working-directory: scripts
        run: python generate-embeddings.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
